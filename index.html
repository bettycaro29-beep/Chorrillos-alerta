<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHORRILLOS ALERTA</title>
<!-- Leaflet (mapas) desde un CDN gratuito -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --fondo:#071226; --panel:#0d1f3c; --borde:#1c3a6b; --azul:#2f80ff; --texto:#eaf1ff; --suave:#9db4d8; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--fondo); color:var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.top { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; padding:10px 16px; background:linear-gradient(90deg,#071226,#0b2a5c); border-bottom:2px solid var(--azul); }
.top h1 { margin:0; font-size:1.3rem; letter-spacing:.12em; }
.top h1 span { color:var(--azul); }
.aviso { margin:0; font-size:.85rem; background:#f5a52422; border:1px solid #f5a524; padding:4px 10px; border-radius:8px; }
.layout { display:grid; grid-template-columns: 1fr 360px; height:calc(100% - 62px); }
.mapa-wrap { position:relative; min-height:320px; }
#mapa { position:absolute; inset:0; }
.btn-mapa { position:absolute; z-index:1000; right:10px; top:10px; }
.panel { overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; background:var(--fondo); }
.tarjeta { position:relative; background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:12px; }
h2 { margin:0 0 8px; font-size:1rem; color:var(--azul); }
button, select { font:inherit; color:var(--texto); background:#12315f; border:1px solid var(--azul); border-radius:10px; padding:10px 12px; min-height:44px; cursor:pointer; }
button:hover { background:var(--azul); }
select { width:100%; margin:4px 0 8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip { min-height:40px; padding:6px 10px; }
.chip[aria-pressed="false"] { opacity:.45; }
.contadores, .leyenda { list-style:none; padding:0; margin:6px 0; display:grid; gap:4px; font-size:.92rem; }
.total { margin:0; } .total strong { font-size:1.8rem; color:var(--azul); }
.peq { font-size:.82rem; color:var(--suave); }
.oculto { display:none; }
.cerrar { position:absolute; right:8px; top:8px; min-height:36px; padding:4px 10px; }
.demo-tag { display:inline-block; background:#f5a524; color:#000; font-weight:700; padding:3px 8px; border-radius:6px; font-size:.78rem; }
.detalle dl { margin:8px 0 0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:.9rem; }
.detalle dt { color:var(--suave); }
.detalle dd { margin:0; }
.pin { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:18px; border:3px solid #fff; box-shadow:0 2px 8px #0008; }
.hora { display:flex; justify-content:space-between; font-size:.85rem; padding:2px 0; border-bottom:1px solid var(--borde); }
@media (max-width: 800px) {
  .layout { grid-template-columns:1fr; grid-template-rows: 55vh auto; height:auto; }
  html, body { height:auto; }
  .detalle { position:fixed; left:8px; right:8px; bottom:8px; z-index:2000; max-height:45vh; overflow:auto; box-shadow:0 -4px 20px #000a; }
}
@media (prefers-reduced-motion: no-preference) { .tarjeta { transition: border-color .2s; } .tarjeta:hover { border-color: var(--azul); } }

</style>
</head>
<body>
<header class="top">
  <h1>CHORRILLOS <span>ALERTA</span></h1>
  <p class="aviso" role="note">⚠️ Prototipo demostrativo. No sustituye los canales oficiales de emergencia.</p>
</header>

<main class="layout">
  <div class="mapa-wrap">
    <div id="mapa" aria-label="Mapa interactivo de Chorrillos"></div>
    <button id="btn-centrar" class="btn-mapa" type="button">🎯 Centrar en Chorrillos</button>
  </div>

  <aside class="panel">
    <!-- Ficha del incidente (panel lateral en pantallas grandes, ventana inferior en móviles) -->
    <section id="detalle" class="tarjeta detalle oculto" aria-live="polite">
      <button id="cerrar-detalle" class="cerrar" type="button" aria-label="Cerrar ficha">✕</button>
      <div id="detalle-cuerpo"></div>
    </section>

    <section class="tarjeta">
      <h2>Resumen</h2>
      <p class="total"><strong id="total">0</strong> incidentes de demostración visibles</p>
      <ul id="contadores" class="contadores"></ul>
      <p class="peq">Última actualización de datos: <span id="actualizacion">—</span></p>
    </section>

    <section class="tarjeta">
      <h2>Filtros</h2>
      <div id="filtros-cat" class="chips"></div>
      <label for="filtro-estado">Estado</label>
      <select id="filtro-estado"></select>
      <button id="btn-reset" type="button">Limpiar filtros</button>
    </section>

    <section class="tarjeta">
      <h2>Meteorología</h2>
      <div id="clima" class="peq">Cargando…</div>
      <button id="btn-clima" type="button">🔄 Actualizar clima</button>
      <p class="peq">Es un pronóstico (Open-Meteo), no una alerta oficial.</p>
    </section>

    <section class="tarjeta">
      <h2>Leyenda</h2>
      <ul id="leyenda" class="leyenda"></ul>
    </section>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// DATOS DE DEMOSTRACIÓN — TODOS FICTICIOS.
// Las posiciones son aproximadas y solo sirven para probar el mapa.
// Se mantienen separados de los futuros reportes reales (REPORTES_REALES).
const CENTRO_CHORRILLOS = [-12.17, -77.015]; // coordenadas aproximadas del distrito

const CATEGORIAS = {
  incendio:   { nombre: "Incendios",            icono: "🔥", color: "#e5484d" },
  robo:       { nombre: "Robos reportados",     icono: "🚔", color: "#6e56cf" },
  medica:     { nombre: "Emergencias médicas",  icono: "🚑", color: "#12a594" },
  inundacion: { nombre: "Inundaciones",         icono: "🌊", color: "#0090ff" },
  clima:      { nombre: "Riesgos meteorológicos", icono: "🌧️", color: "#5b7083" },
  otro:       { nombre: "Otros incidentes",     icono: "⚠️", color: "#f5a524" }
};

const ESTADOS = {
  pendiente: "Pendiente", verificacion: "En verificación",
  confirmado: "Confirmado", atencion: "En atención", resuelto: "Resuelto"
};

const DATOS_ACTUALIZADOS = "2026-10-22T08:00:00-05:00";

const INCIDENTES_DEMO = [
  { codigo: "DEMO-001", cat: "incendio", titulo: "Incendio simulado en vivienda", desc: "Escenario ficticio para probar el mapa.", fecha: "2026-10-22T07:30:00-05:00", lugar: "Zona Villa (aprox.)", estado: "atencion", fuente: "Demostración interna", lat: -12.1890, lng: -77.0030 },
  { codigo: "DEMO-002", cat: "robo", titulo: "Reporte simulado de robo", desc: "Caso ficticio, sin personas ni hechos reales.", fecha: "2026-10-21T21:15:00-05:00", lugar: "Av. Huaylas (aprox.)", estado: "verificacion", fuente: "Demostración interna", lat: -12.1700, lng: -77.0100 },
  { codigo: "DEMO-003", cat: "medica", titulo: "Emergencia médica simulada", desc: "Ejemplo para probar filtros y fichas.", fecha: "2026-10-22T06:40:00-05:00", lugar: "Cerca de la Plaza (aprox.)", estado: "confirmado", fuente: "Demostración interna", lat: -12.1690, lng: -77.0170 },
  { codigo: "DEMO-004", cat: "inundacion", titulo: "Acumulación de agua simulada", desc: "Caso ficticio de riesgo por agua en calzada.", fecha: "2026-10-20T18:00:00-05:00", lugar: "Zona baja costera (aprox.)", estado: "pendiente", fuente: "Demostración interna", lat: -12.1650, lng: -77.0260 },
  { codigo: "DEMO-005", cat: "clima", titulo: "Riesgo de neblina simulado", desc: "Ejemplo ficticio; no es una alerta oficial.", fecha: "2026-10-22T05:50:00-05:00", lugar: "Morro Solar (aprox.)", estado: "confirmado", fuente: "Demostración interna", lat: -12.1960, lng: -77.0200 },
  { codigo: "DEMO-006", cat: "otro", titulo: "Poste caído simulado", desc: "Incidente ficticio para la demostración.", fecha: "2026-10-19T12:20:00-05:00", lugar: "Zona Matute (aprox.)", estado: "resuelto", fuente: "Demostración interna", lat: -12.1760, lng: -77.0080 },
  { codigo: "DEMO-007", cat: "robo", titulo: "Otro reporte simulado", desc: "Caso ficticio para probar contadores.", fecha: "2026-10-18T22:10:00-05:00", lugar: "Cerca de la costa (aprox.)", estado: "resuelto", fuente: "Demostración interna", lat: -12.1800, lng: -77.0230 }
];

// Aquí irán más adelante los reportes reales verificados (hoy vacío).
const REPORTES_REALES = [];

</script>
<script>
// ===== CHORRILLOS ALERTA — lógica principal =====
const TODOS = [...INCIDENTES_DEMO.map(i => ({ ...i, demo: true })), ...REPORTES_REALES];
const filtro = { cats: new Set(Object.keys(CATEGORIAS)), estado: "todos" };
const $ = id => document.getElementById(id);
const fmt = iso => new Date(iso).toLocaleString("es-PE", { dateStyle: "medium", timeStyle: "short" });

// --- Mapa (Leaflet + OpenStreetMap) ---
const mapa = L.map("mapa").setView(CENTRO_CHORRILLOS, 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; Colaboradores de OpenStreetMap"
}).addTo(mapa);
const capa = L.layerGroup().addTo(mapa);
$("btn-centrar").onclick = () => mapa.setView(CENTRO_CHORRILLOS, 14);

function crearIcono(c) {
  return L.divIcon({ className: "", iconSize: [36, 36], iconAnchor: [18, 18],
    html: `<div class="pin" style="background:${c.color}">${c.icono}</div>` });
}

// --- Filtros ---
function visibles() {
  return TODOS.filter(i => filtro.cats.has(i.cat) && (filtro.estado === "todos" || i.estado === filtro.estado));
}

function dibujar() {
  const lista = visibles();
  capa.clearLayers();
  lista.forEach(i => {
    L.marker([i.lat, i.lng], { icon: crearIcono(CATEGORIAS[i.cat]), title: i.titulo, keyboard: true })
      .on("click", () => mostrarFicha(i)).addTo(capa);
  });
  // Contadores calculados desde los datos filtrados
  $("total").textContent = lista.length;
  $("contadores").innerHTML = "";
  Object.entries(CATEGORIAS).forEach(([k, c]) => {
    const li = document.createElement("li");
    li.textContent = `${c.icono} ${c.nombre}: ${lista.filter(i => i.cat === k).length}`;
    $("contadores").appendChild(li);
  });
  $("actualizacion").textContent = fmt(DATOS_ACTUALIZADOS);
}

function construirControles() {
  Object.entries(CATEGORIAS).forEach(([k, c]) => {
    // Chips de filtro
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = `${c.icono} ${c.nombre}`;
    b.setAttribute("aria-pressed", "true");
    b.onclick = () => {
      filtro.cats.has(k) ? filtro.cats.delete(k) : filtro.cats.add(k);
      b.setAttribute("aria-pressed", filtro.cats.has(k));
      dibujar();
    };
    $("filtros-cat").appendChild(b);
    // Leyenda
    const li = document.createElement("li");
    li.innerHTML = `<span class="pin" style="background:${c.color};display:inline-grid;width:26px;height:26px;font-size:14px">${c.icono}</span> `;
    li.append(c.nombre);
    $("leyenda").appendChild(li);
  });
  const sel = $("filtro-estado");
  sel.add(new Option("Todos los estados", "todos"));
  Object.entries(ESTADOS).forEach(([k, v]) => sel.add(new Option(v, k)));
  sel.onchange = () => { filtro.estado = sel.value; dibujar(); };
  $("btn-reset").onclick = () => {
    filtro.cats = new Set(Object.keys(CATEGORIAS)); filtro.estado = "todos"; sel.value = "todos";
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "true"));
    dibujar();
  };
}

// --- Ficha del incidente (se usa textContent para evitar inyección de HTML) ---
function mostrarFicha(i) {
  const c = CATEGORIAS[i.cat];
  const cuerpo = $("detalle-cuerpo"); cuerpo.innerHTML = "";
  const tag = document.createElement("span"); tag.className = "demo-tag";
  tag.textContent = i.demo ? "DEMO — NO ES UN REPORTE REAL" : "Reporte real verificado";
  const h = document.createElement("h2"); h.textContent = `${c.icono} ${i.titulo}`;
  const dl = document.createElement("dl");
  [["Código", i.codigo], ["Categoría", c.nombre], ["Descripción", i.desc], ["Fecha y hora", fmt(i.fecha)],
   ["Ubicación", i.lugar], ["Estado", ESTADOS[i.estado]], ["Fuente", i.fuente]].forEach(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v; dl.append(dt, dd);
  });
  cuerpo.append(tag, h, dl);
  $("detalle").classList.remove("oculto");
  $("detalle").scrollIntoView({ block: "nearest" });
}
$("cerrar-detalle").onclick = () => $("detalle").classList.add("oculto");

// --- Meteorología (Open-Meteo) ---
const CODIGOS = { 0:"Despejado",1:"Mayormente despejado",2:"Parcialmente nublado",3:"Nublado",45:"Niebla",48:"Niebla con escarcha",
  51:"Llovizna ligera",53:"Llovizna",55:"Llovizna intensa",61:"Lluvia ligera",63:"Lluvia",65:"Lluvia fuerte",80:"Chubascos",95:"Tormenta" };

async function cargarClima() {
  const caja = $("clima");
  if (!navigator.onLine) { caja.textContent = "Sin conexión a internet. No se pudo obtener el clima."; return; }
  caja.textContent = "Cargando clima…";
  const url = "https://api.open-meteo.com/v1/forecast?latitude=-12.17&longitude=-77.015" +
    "&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability" +
    "&forecast_days=2&timezone=America%2FLima";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("Estado HTTP " + r.status);
    const d = await r.json();
    const act = d.current;
    caja.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = `🌡️ ${act.temperature_2m} °C · ${CODIGOS[act.weather_code] || "Código " + act.weather_code} · 💨 ${act.wind_speed_10m} km/h`;
    caja.appendChild(p);
    // Próximas 6 horas a partir de la hora actual
    const idx = d.hourly.time.findIndex(t => t >= act.time.slice(0, 13));
    for (let k = Math.max(idx, 0); k < Math.max(idx, 0) + 6 && k < d.hourly.time.length; k++) {
      const f = document.createElement("div"); f.className = "hora";
      const prob = d.hourly.precipitation_probability[k];
      f.textContent = `${d.hourly.time[k].slice(11)} h — ${d.hourly.temperature_2m[k]} °C — lluvia: ${prob ?? "s/d"}${prob != null ? "%" : ""}`;
      caja.appendChild(f);
    }
    const u = document.createElement("p"); u.className = "peq";
    u.textContent = "Actualizado: " + fmt(new Date());
    caja.appendChild(u);
  } catch (e) {
    console.error(e);
    caja.textContent = "No se pudo cargar el clima desde Open-Meteo. Intenta de nuevo más tarde.";
  }
}
$("btn-clima").onclick = cargarClima;
window.addEventListener("online", cargarClima);

// --- Inicio ---
construirControles(); dibujar(); cargarClima();

</script>
</body>
</html>
